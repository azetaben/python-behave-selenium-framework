[behave]
# Behave configuration

# Output format
format = pretty

# Logging
log_capture = true
log_level = INFO
logging_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
logging_datefmt = %Y-%m-%d %H:%M:%S

# Features location
paths = features

# Steps location (default: features/steps/)

# Tags to include/exclude
# tags = @smoke,@regression

# Output capturing
capture = true

# Formatters
formatters = allure_behave.formatter:AllureFormatter
outdir = reports/allure-results

# Parallel execution
# parallel = true
# parallel_processes = 4

# Expand outlines
expand = false

# Show rules
show_rules = false
